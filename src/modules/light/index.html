<!DOCTYPE html>
<!-- Iron V light control (REV-25), served from flash at / and /index.html.
     Talks to the board's REST v1 API only; no timers, no polling (REV-15): refresh on load, on Refresh and
     when the page becomes visible again.
     The build minifies and gzips this file (scripts/gen_web.py): comments in the script go on lines of
     their own, no multi-line strings, no strings in the CSS. `make host-test` checks the rules and size. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Iron V</title>
<link rel="icon" href="data:,">
<style>
  body { background: #0f172a; color: #f8fafc; font: 15px system-ui, sans-serif; max-width: 380px; margin: auto; padding: 16px; }
  header, .row, footer { display: flex; justify-content: space-between; align-items: center; }
  h1 { color: #38bdf8; font-size: 18px; margin: 0; }
  #link, #error { color: #f87171; font-size: 13px; }
  #link.online { color: #4ade80; }
  #lamp { display: block; width: 150px; height: 150px; margin: 28px auto 10px; border: 0; border-radius: 50%;
          background: #334155; color: #94a3b8; transition: .3s; }
  #lamp.on { color: #0f172a; }
  #summary, .row, footer { color: #94a3b8; font-size: 12px; }
  #summary { text-align: center; font-size: 15px; margin-bottom: 18px; }
  .card { background: #1e293b; border-radius: 12px; padding: 14px; margin: 10px 0; }
  .row { text-transform: uppercase; margin-bottom: 10px; }
  #brightness { width: 100%; accent-color: #38bdf8; }
  #swatches { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; }
  #swatches > * { width: 100%; height: auto; aspect-ratio: 1; border: 0; border-radius: 50%; padding: 0; }
  .selected { box-shadow: 0 0 0 2px #1e293b, 0 0 0 4px #f8fafc; }
  #custom { appearance: none; background: conic-gradient(red, #ff0, lime, cyan, blue, #f0f, red); }
  #custom::-webkit-color-swatch { opacity: 0; }
  #custom::-moz-color-swatch { opacity: 0; }
  footer { flex-wrap: wrap; gap: 6px; }
  a { color: #38bdf8; }
</style>
</head>
<body>
<header><h1>Iron V</h1><span id="link">connecting</span></header>
<button id="lamp" aria-label="Power">
  <svg width="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 3v8M6.3 6.3a8 8 0 1 0 11.4 0"/></svg>
</button>
<p id="summary">&nbsp;</p>
<section class="card">
  <div class="row">Brightness<span id="level"></span></div>
  <input id="brightness" type="range" min="1" max="100" aria-label="Brightness">
</section>
<section class="card">
  <div class="row">Colour</div>
  <div id="swatches"><input id="custom" type="color" aria-label="Any colour"></div>
</section>
<p id="error"></p>
<footer>
  <span id="device"></span>
  <span><a href="#" id="refresh">Refresh</a> &middot; <a href="/setup">Wi-Fi setup</a></span>
</footer>
<script>
'use strict';
const PRESETS = ['#ffffff', '#ffb46b', '#ff2222', '#ff8800', '#ffdd00', '#22ee44',
                 '#00ddbb', '#00ccff', '#2255ff', '#aa44ff', '#ff44aa'];
const el = id => document.getElementById(id);
// `light` is what the page shows {state, brightness, color: {r, g, b}} and runs ahead of the board while a
// command is on its way; `confirmed` is the last state the board reported (JSON). One request at a time
// (weak link, small board); changes made meanwhile are merged into `pending` and sent when it returns.
let light = null;
let confirmed = null;
let inFlight = false;
let pending = null;

const toHex = c => '#' + [c.r, c.g, c.b].map(x => x.toString(16).padStart(2, '0')).join('');
function fromHex(hex) {
  const n = parseInt(hex.slice(1), 16);
  return { r: n >> 16, g: (n >> 8) & 255, b: n & 255 };
}

function setOnline(online) {
  el('link').textContent = online ? 'online' : 'offline';
  el('link').className = online ? 'online' : '';
}

function render(s) {
  light = s;
  const on = s.state === 'ON', hex = toHex(s.color), level = s.brightness / 100;
  const lamp = el('lamp');
  lamp.className = on ? 'on' : '';
  lamp.style.background = on ? hex : '';
  lamp.style.boxShadow = on ? `0 0 ${16 + 48 * level}px ${hex}` : '';
  lamp.style.filter = on ? `brightness(${0.55 + 0.45 * level})` : '';
  el('summary').textContent = on ? `On · ${s.brightness}%` : 'Off';
  el('level').textContent = s.brightness + '%';
  el('brightness').value = s.brightness;
  el('custom').value = hex;
  let preset = false;
  for (const swatch of document.querySelectorAll('#swatches button')) {
    preset = swatch.classList.toggle('selected', swatch.value === hex) || preset;
  }
  el('custom').classList.toggle('selected', !preset);
}

// State reported by the board
function show(s) {
  confirmed = JSON.stringify(s);
  render(s);
}

// GET without a body, POST with one; rejects with the board's error reason on 4xx
function api(path, body) {
  const init = body && { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) };
  return fetch('/api/v1/' + path, init).then(r => r.json().then(d => {
    if (!r.ok) throw new Error(d.error);
    setOnline(true);
    return d;
  }));
}

function report(err) {
  // TypeError: network failure, the board is not reachable
  if (err instanceof TypeError) setOnline(false);
  else el('error').textContent = 'Error: ' + err.message;
}

function send(cmd) {
  if (inFlight) { pending = Object.assign(pending || {}, cmd); return; }
  inFlight = true;
  api('light', cmd)
    .then(s => { el('error').textContent = ''; if (pending) confirmed = JSON.stringify(s); else show(s); },
          err => {
            report(err);
            // Not applied: back to what the board last reported, then ask it again
            if (!pending) { if (confirmed) render(JSON.parse(confirmed)); refresh(); }
          })
    .then(() => {
      inFlight = false;
      if (pending) { const next = pending; pending = null; send(next); }
    });
}

// Show the change at once, then send it; the board's reply confirms it
function change(cmd) {
  if (!light) return;
  render(Object.assign(light, cmd));
  send(cmd);
}

function pickColour(hex) {
  const c = fromHex(hex);
  // Black is not a colour for the board (rule 2.2.4): it means off
  change(c.r || c.g || c.b ? { state: 'ON', color: c } : { state: 'OFF' });
}

function refresh() {
  api('light').then(show).then(() => api('device')).then(d => {
    const up = d.uptime_s;
    el('device').textContent = `${d.ip} · fw ${d.fw} · up ${Math.floor(up / 3600)}h ${Math.floor(up / 60) % 60}m`;
  }, report);
}

el('lamp').onclick = () => light && change({ state: light.state === 'ON' ? 'OFF' : 'ON' });
el('brightness').oninput = e => change({ state: 'ON', brightness: Number(e.target.value) });
el('custom').oninput = e => pickColour(e.target.value);
el('refresh').onclick = e => { e.preventDefault(); refresh(); };
for (const hex of PRESETS) {
  const swatch = document.createElement('button');
  swatch.value = swatch.style.background = hex;
  swatch.setAttribute('aria-label', hex);
  swatch.onclick = () => pickColour(hex);
  el('swatches').insertBefore(swatch, el('custom'));
}
document.addEventListener('visibilitychange', () => { if (!document.hidden) refresh(); });
refresh();
</script>
</body>
</html>
