# Iron-V bridge broker (REV-24). Users in ./passwd (untracked), created by setup.sh.
listener 1883
allow_anonymous false
password_file /mosquitto/config/passwd

# Retained availability/discovery/state must survive a broker restart.
persistence true
persistence_location /mosquitto/data/
autosave_interval 60

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
